<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>仓库运营管理平台 - 成本管理</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07110f;
      --panel: rgba(13, 24, 23, .88);
      --line: rgba(190, 255, 243, .2);
      --text: #f4fbf8;
      --muted: #9fb3ae;
      --accent: #6ee7d2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(110, 231, 210, .05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(110, 231, 210, .05) 1px, transparent 1px),
        radial-gradient(circle at 20% 10%, rgba(110, 231, 210, .16), transparent 30%),
        var(--bg);
      background-size: 48px 48px, 48px 48px, auto, auto;
    }
    .shell { width: min(1180px, calc(100% - 48px)); margin: 0 auto; padding: 32px 0 56px; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(9, 18, 17, .78);
      box-shadow: 0 18px 48px rgba(0, 0, 0, .24);
    }
    .brand { display: flex; flex-direction: column; gap: 6px; }
    .brand strong { font-size: 24px; }
    .brand span { color: var(--muted); font-size: 15px; }
    .back {
      color: var(--accent);
      text-decoration: none;
      font-weight: 800;
      border: 1px solid rgba(110, 231, 210, .32);
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(110, 231, 210, .08);
    }
    .notice {
      min-height: 58vh;
      display: grid;
      align-content: center;
      gap: 18px;
      padding: 48px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(110, 231, 210, .09), rgba(255, 224, 163, .04)), var(--panel);
    }
    .label { color: var(--accent); font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(34px, 5vw, 72px); letter-spacing: 0; line-height: 1.02; }
    p { margin: 0; max-width: 720px; color: var(--muted); font-size: 18px; line-height: 1.8; }
    @media (max-width: 720px) {
      .shell { width: min(100% - 24px, 1180px); padding-top: 16px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .notice { padding: 28px; min-height: 52vh; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <strong>仓库运营管理平台</strong>
        <span>运营驾驶舱 / 成本管理</span>
      </div>
      <a class="back" href="../../index.html">返回主页</a>
    </header>
    <section class="notice">
      <span class="label">Temporarily Offline</span>
      <h1>成本管理暂不发布</h1>
      <p>当前公开版本已保留成本管理入口，但不展示成本明细、统计图表或原始数据。后续需要开放时，可再同步完整内容。</p>
    </section>
  </main>
</body>
</html>
